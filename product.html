<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Militaristica - Товар</title>
    
    <!-- OG_META_TAGS -->

    <link rel="stylesheet" href="styles.css">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; }
        header { background-color: #1e1e1e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; }
        header img { height: 40px; }
        .nav-buttons { display: flex; gap: 15px; align-items: center; }
        .btn { padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; text-decoration: none; border: 1px solid #444; color: white; background: #282c34; }
        .btn:hover { background: #3e4451; }
        .btn-red { background-color: #e06c75; border-color: #e06c75; }
        .btn-red:hover { background-color: #c9515b; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        
        .product-layout { display: flex; flex-wrap: wrap; gap: 30px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 30px; }
        
        /* Галерея */
        .gallery-box { width: 45%; min-width: 280px; flex: 1; }
        .main-img { width: 100%; height: auto; max-height: 400px; object-fit: contain; background: #282c34; border-radius: 6px; margin-bottom: 15px; display: block; }
        .thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
        .thumb-img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
        .thumb-img.active { border-color: #e06c75; }

        /* Інформація */
        .info-box { width: 50%; min-width: 280px; flex: 1; display: flex; flex-direction: column; }
        .sku-badge { color: #e06c75; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
        
        h1 { margin: 0 0 15px 0; font-size: 1.25rem; line-height: 1.4; font-weight: 700; color: #ffffff; word-break: break-word; }
        h1 span.accent { color: #a3e635; }

        .price-tag { font-size: 28px; font-weight: bold; color: #98c379; margin-bottom: 20px; }
        .stock-tag { font-size: 14px; color: #aaa; margin-bottom: 25px; }
        
        .btn-cart { background: #98c379; color: #121212; border: none; padding: 14px 25px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 30px; transition: 0.2s; align-self: flex-start; }
        .btn-cart:hover { background: #7cb05a; }

        /* Нижня кнопка кошика на всю ширину для зручності */
        .btn-cart-bottom { width: 100%; margin-top: 25px; margin-bottom: 0; text-align: center; }

        .full-width-section { width: 100%; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; }
        h3 { border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 0; color: #fff; }
        
        .desc-text { line-height: 1.6; color: #ccc; white-space: pre-wrap; margin-bottom: 15px; }
        .description-limited {
            max-height: 220px;
            overflow: hidden;
            position: relative;
        }
        .description-limited::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(transparent, #1e1e1e);
        }
        .read-more-btn {
            background: transparent;
            border: 1px solid #a3e635;
            color: #a3e635;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .read-more-btn:hover {
            background: rgba(163, 230, 53, 0.1);
        }

        table.chars-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        table.chars-table td { padding: 8px 12px; border-bottom: 1px solid #282c34; font-size: 14px; }
        table.chars-table td:first-child { color: #888; width: 40%; }
        table.chars-table td:last-child { color: #fff; }

        @media(max-width: 768px) {
            .product-layout { flex-direction: column; padding: 15px; }
            .gallery-box, .info-box { width: 100%; }
        }
    </style>
    <!-- OG_META_TAGS -->
</head>
<body>

    <header>
        <a href="index.html"><img src="logo.jpg" alt="Militaristica Logo"></a>
        <div class="nav-buttons">
            <a href="shop.html" class="btn">Каталог</a>
            <a href="cart.html" class="btn btn-red">🛒 КОШИК</a>
            <a href="auth.html" class="btn">Вхід / Реєстрація</a>
        </div>
    </header>

    <div class="container">
        <div class="product-layout" id="productContent">
            <p style="color: #aaa;">Завантаження товару...</p>
        </div>
    </div>

    <script>
        let currentProduct = null;

        async function loadProductDetails() {
            let params = new URLSearchParams(window.location.search);
            let prodId = params.get('id');

            if (!prodId) {
                document.getElementById('productContent').innerHTML = '<p>Товар не знайдено. <a href="shop.html" style="color:#e06c75;">Повернутися до каталогу</a></p>';
                return;
            }

            try {
                let res = await fetch(`/api/products/${prodId}`);
                if (!res.ok) throw new Error();
                currentProduct = await res.json();
                renderProduct(currentProduct);
            } catch (err) {
                document.getElementById('productContent').innerHTML = '<p>Помилка завантаження даних товару.</p>';
            }
        }

        function renderProduct(p) {
            let images = (p.image_urls && p.image_urls.length > 0) ? p.image_urls.split(',') : ['logo.jpg'];
            
            let thumbsHtml = '';
            images.forEach((img, idx) => {
                thumbsHtml += `<img src="${img.trim()}" class="thumb-img ${idx===0?'active':''}" onclick="selectImage('${img.trim()}', this)">`;
            });

            let charsHtml = '';
            if (p.characteristics && p.characteristics !== "[]") {
                try {
                    let parsedChars = JSON.parse(p.characteristics);
                    if (Array.isArray(parsedChars) && parsedChars.length > 0) {
                        charsHtml += `<h3>Характеристики</h3><table class="chars-table">`;
                        parsedChars.forEach(c => {
                            charsHtml += `<tr><td>${c.name}</td><td>${c.value}</td></tr>`;
                        });
                        charsHtml += `</table>`;
                    }
                } catch(e) {}
            }

            let titleWords = p.title ? p.title.split(' ') : [];
            let formattedTitle = p.title;
            if (titleWords.length > 2) {
                let accentPart = titleWords.slice(0, 2).join(' ');
                let restPart = titleWords.slice(2).join(' ');
                formattedTitle = `<span class="accent">${accentPart}</span> ${restPart}`;
            }

            document.getElementById('productContent').innerHTML = `
                <div class="gallery-box">
                    <img src="${images[0].trim()}" id="mainViewImg" class="main-img">
                    <div class="thumbs">${thumbsHtml}</div>
                </div>
                <div class="info-box">
                    <div class="sku-badge">${p.sku}</div>
                    <h1>${formattedTitle}</h1>
                    <div class="price-tag">${p.price} ₴</div>
                    <div class="stock-tag">В наявності: ${p.stock} шт</div>
                    <button class="btn-cart" onclick="addToCart()">ДОДАТИ В КОШИК</button>
                </div>

                <div class="full-width-section">
                    <h3>Опис товару</h3>
                    <div class="desc-text" id="descContainer">${p.description}</div>
                    <button id="readMoreBtn" class="read-more-btn" style="display:none;" onclick="toggleDescription()">Читати далі</button>
                    ${charsHtml}
                    <button class="btn-cart btn-cart-bottom" onclick="addToCart()">ДОДАТИ В КОШИК</button>
                </div>
            `;

            setTimeout(checkDescriptionHeight, 50);
        }

        function checkDescriptionHeight() {
            const desc = document.getElementById('descContainer');
            const btn = document.getElementById('readMoreBtn');
            if (desc && btn) {
                if (desc.scrollHeight > 200) {
                    desc.classList.add('description-limited');
                    btn.style.display = 'inline-block';
                }
            }
        }

        function toggleDescription() {
            const desc = document.getElementById('descContainer');
            const btn = document.getElementById('readMoreBtn');
            if (desc.classList.contains('description-limited')) {
                desc.classList.remove('description-limited');
                btn.innerText = 'Згорнути';
            } else {
                desc.classList.add('description-limited');
                btn.innerText = 'Читати далі';
            }
        }

        function selectImage(url, el) {
            document.getElementById('mainViewImg').src = url;
            document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function addToCart() {
            if (!currentProduct) return;
            let cart = JSON.parse(localStorage.getItem('militaristica_cart')) || [];
            let existingItem = cart.find(item => item.id === currentProduct.id);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    id: currentProduct.id,
                    sku: currentProduct.sku,
                    title: currentProduct.title,
                    price: currentProduct.price,
                    image: (currentProduct.image_urls && currentProduct.image_urls.length > 0) ? currentProduct.image_urls.split(',')[0] : 'logo.jpg',
                    quantity: 1
                });
            }

            localStorage.setItem('militaristica_cart', JSON.stringify(cart));
            alert("Товар успішно додано до кошика!");
        }

        document.addEventListener("DOMContentLoaded", loadProductDetails);
    </script>
</body>
</html>
