<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Militaristica — Дашборд</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .sidebar-logo { padding: 20px; text-align: center; border-bottom: 1px solid #333; }
        .sidebar-logo img { max-width: 80%; }
        .sidebar-menu { display: flex; flex-direction: column; padding: 10px 0; flex-grow: 1; }
        .menu-item { padding: 15px 20px; color: #aaa; text-decoration: none; border-left: 4px solid transparent; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .menu-item:hover, .menu-item.active { background-color: #282c34; color: #fff; border-left-color: #e06c75; }
        .sidebar-bottom { padding: 20px; border-top: 1px solid #333; }
        .btn-logout { width: 100%; padding: 12px; background-color: transparent; border: 1px solid #a33333; color: #e06c75; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background-color: #a33333; color: white; }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { background-color: #1e1e1e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .topbar-title { font-size: 18px; font-weight: bold; color: #fff; text-transform: uppercase; }
        
        .content-area { padding: 30px; }
        
        .stats-grid { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .stat-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 25px; flex: 1; min-width: 200px; text-align: center; }
        .stat-card h3 { color: #888; font-size: 13px; text-transform: uppercase; margin-top: 0; margin-bottom: 15px; }
        .stat-card .number { font-size: 48px; font-weight: 900; color: #fff; margin: 0; }
        .stat-card .number.green { color: #98c379; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="sidebar-logo"><img src="logo.jpg" alt="Logo"></div>
            <div class="sidebar-menu">
                <a href="admin_dashboard.html" class="menu-item active">📊 Головна (Дашборд)</a>
                <a href="admin_orders.html" class="menu-item">📦 Замовлення</a>
                <a href="admin_products.html" class="menu-item">🛍️ Товари</a>
                <a href="admin_users.html" class="menu-item admin-only">👥 Користувачі</a>
                <a href="admin_media.html" class="menu-item admin-only">🖼️ Стрічка</a>
            </div>
        </div>
        <div class="sidebar-bottom">
            <button class="btn-logout" onclick="window.location.href='index.html'">ВИЙТИ З ПАНЕЛІ</button>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title" id="dashboardTitle">ГОЛОВНА ПАНЕЛЬ АДМІНІСТРАТОРА</div>
            <div id="topUserName" style="color: #aaa;"></div>
        </div>

        <div class="content-area">
            <h2 style="margin-top: 0;">Загальна статистика системи</h2>
            <p style="color: #888; margin-top: -10px;">Для управління платформою використовуйте меню навігації зліва.</p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Всього товарів у базі</h3>
                    <div class="number" id="countProducts">...</div>
                </div>
                <div class="stat-card">
                    <h3>Всього замовлень</h3>
                    <div class="number" id="countOrders">...</div>
                </div>
                <div class="stat-card admin-only">
                    <h3>Зареєстровано користувачів</h3>
                    <div class="number green" id="countUsers">...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Перевірка авторизації
        let user = JSON.parse(localStorage.getItem('militaristica_user'));
        if (!user || user.role === 'user') window.location.href = 'index.html';

        document.getElementById('topUserName').innerText = `Привіт, ${user.name}`;
        
        // Налаштування інтерфейсу залежно від ролі
        if (user.role === 'seller') {
            document.getElementById('dashboardTitle').innerText = `ПАНЕЛЬ ПРОДАВЦЯ: ${user.name.toUpperCase()}`;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        }

        // Завантаження реальної статистики із запобіжниками помилок
        async function loadStats() {
            try {
                let prodUrl = (user.role === 'admin') ? '/api/products' : `/api/products/seller/${user.id}`;
                let ordersUrl = (user.role === 'admin') ? '/api/orders' : `/api/orders/seller/${user.id}`;

                let [prodsRes, ordersRes] = await Promise.all([fetch(prodUrl), fetch(ordersUrl)]);

                if (prodsRes.ok) {
                    let prods = await prodsRes.json();
                    document.getElementById('countProducts').innerText = prods.length;
                }
                
                if (ordersRes.ok) {
                    let orders = await ordersRes.json();
                    document.getElementById('countOrders').innerText = orders.length;
                } else {
                    document.getElementById('countOrders').innerText = "0";
                }

                if (user.role === 'admin') {
                    let usersRes = await fetch('/api/users');
                    if (usersRes.ok) {
                        let usersList = await usersRes.json();
                        document.getElementById('countUsers').innerText = usersList.length;
                    }
                }
            } catch (err) {
                console.error("Помилка завантаження статистики:", err);
            }
        }

        document.addEventListener("DOMContentLoaded", loadStats);
    </script>
</body>
</html>
