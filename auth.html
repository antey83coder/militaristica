<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Militaristica — Вхід</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');
        body { background-color: #1a1e18; color: #ffffff; font-family: 'Roboto', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { background-color: #1f241d; border: 1px solid #4a5444; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); overflow: hidden; }
        .auth-header { text-align: center; padding: 20px; background-color: #141712; border-bottom: 2px solid #a33333; }
        .auth-header img { max-height: 40px; }
        .tabs { display: flex; border-bottom: 1px solid #3b4238; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; background: #1f241d; color: #888; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; text-transform: uppercase; }
        .tab-btn.active { color: #fff; background: #2b3028; border-bottom: 3px solid #a33333; }
        .form-box { padding: 30px; display: none; }
        .form-box.active { display: block; }
        .form-input { width: 100%; box-sizing: border-box; background-color: #1a1e18; border: 1px solid #4a5444; color: #ffffff; padding: 12px; border-radius: 4px; font-size: 15px; margin-bottom: 15px; outline: none; }
        .form-input:focus { border-color: #a33333; }
        .btn-submit { background-color: #a33333; color: white; border: none; width: 100%; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .back-link { display: block; text-align: center; color: #888; text-decoration: none; margin: 20px 0; font-size: 13px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header"><img src="logo.jpg" alt="Militaristica"></div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')" id="tab-login">Вхід</button>
            <button class="tab-btn" onclick="switchTab('register')" id="tab-register">Реєстрація</button>
        </div>

        <!-- Форма ВХОДУ -->
        <div id="box-login" class="form-box active">
            <form onsubmit="handleLogin(event)">
                <!-- Додано name та autocomplete для коректної роботи браузера -->
                <input type="email" id="logEmail" name="email" autocomplete="email" class="form-input" placeholder="Електронна пошта" required>
                <input type="password" id="logPass" name="password" autocomplete="current-password" class="form-input" placeholder="Пароль" required>
                <button type="submit" class="btn-submit">УВІЙТИ</button>
            </form>
        </div>

        <!-- Форма РЕЄСТРАЦІЇ -->
        <div id="box-register" class="form-box">
            <form onsubmit="handleRegister(event)">
                <!-- Додано name та відповідні autocomplete (name, email, new-password) -->
                <input type="text" id="regName" name="name" autocomplete="name" class="form-input" placeholder="Ваш позивний або ПІБ" required>
                <input type="email" id="regEmail" name="email" autocomplete="email" class="form-input" placeholder="Електронна пошта" required>
                <input type="password" id="regPass" name="password" autocomplete="new-password" class="form-input" placeholder="Придумайте пароль" required>
                <button type="submit" class="btn-submit">СТВОРИТИ АКАУНТ</button>
            </form>
        </div>
        
        <a href="index.html" class="back-link">← Повернутися на головну</a>
    </div>

    <!-- ТУТ ПОВИНЕН БУТИ JAVASCRIPT -->
    <script>
        // Перемикання вкладок
        function switchTab(tab) {
            document.getElementById('box-login').classList.remove('active');
            document.getElementById('box-register').classList.remove('active');
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            
            document.getElementById('box-' + tab).classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        // РЕАЛЬНА РЕЄСТРАЦІЯ ЧЕРЕЗ СЕРВЕР
        async function handleRegister(e) {
            e.preventDefault();
            let name = document.getElementById('regName').value;
            let email = document.getElementById('regEmail').value;
            let password = document.getElementById('regPass').value;

            // Запаковуємо дані у формат "Справжньої Форми" (FormData), бо сервер очікує Form(...)
            let formData = new FormData();
            formData.append("name", name);
            formData.append("email", email);
            formData.append("password", password);

            try {
                // Відправляємо за правильною адресою з твого main.py
                let response = await fetch('/api/auth/register', {
                    method: 'POST',
                    body: formData // Зверни увагу: тут більше немає JSON.stringify
                });

                if (response.ok) {
                    alert("Реєстрація успішна! Тепер увійдіть у свій акаунт.");
                    switchTab('login');
                    document.getElementById('logEmail').value = email;
                    document.getElementById('logPass').value = '';
                } else {
                    // Якщо помилка (наприклад, Email вже існує) — читаємо деталі від FastAPI
                    let err = await response.json();
                    alert("Помилка реєстрації: " + (err.detail || "Невідома помилка"));
                }
            } catch(err) {
                alert("Помилка з'єднання з сервером. Перевір, чи запущений main.py!");
                console.error(err);
            }
        }

        // РЕАЛЬНИЙ ЛОГІН ЧЕРЕЗ СЕРВЕР
        async function handleLogin(e) {
            e.preventDefault();
            let email = document.getElementById('logEmail').value;
            let password = document.getElementById('logPass').value;

            let formData = new FormData();
            formData.append("email", email);
            formData.append("password", password);

            try {
                let response = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    let userData = await response.json();
                    
                    let finalUser = {
                        id: userData.user_id,
                        user_id: userData.user_id,
                        name: userData.name,
                        email: email, 
                        role: userData.role,
                        avatar_url: userData.avatar_url,
                        telegram_chat_id: userData.telegram_chat_id || "",
                        token: userData.access_token // <--- ЗБЕРІГАЄМО ТОКЕН!
                    };
                    
                    localStorage.setItem('militaristica_user', JSON.stringify(finalUser));
                    window.location.href = 'profile.html';
                } else {
                    let err = await response.json();
                    alert("Помилка входу: " + (err.detail || "Неправильна пошта або пароль."));
                }
            } catch(err) {
                alert("Помилка з'єднання з сервером.");
                console.error(err);
            }
        }

    </script>
</body>
</html>
