<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Встановлення нового пароля — Militaristica</title>
    <style>
        body { background: #121411; color: #fff; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #1d211b; border: 1px solid #333; padding: 30px; border-radius: 8px; width: 90%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #8fa77b; text-align: center; margin-top: 0; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; background: #2a3026; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #a33333; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background: #b83d3d; }
        .toggle-box { font-size: 13px; color: #aaa; margin-bottom: 15px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Новий пароль</h2>
    <form id="resetForm">
        <label>Введіть новий пароль:</label>
        <input type="password" id="newPass" required placeholder="Мінімум 6 символів">

        <label class="toggle-box">
            <input type="checkbox" onchange="const el = document.getElementById('newPass'); el.type = el.type === 'password' ? 'text' : 'password';">
            Показати пароль
        </label>

        <button type="submit">Зберегти пароль</button>
    </form>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
    alert("Токен відновлення відсутній!");
    window.location.href = "/";
}

document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const newPass = document.getElementById("newPass").value;

    const fd = new FormData();
    fd.append("token", token);
    fd.append("new_password", newPass);

    try {
        const res = await fetch("/api/auth/reset-password", { method: "POST", body: fd });
        const data = await res.json();

        if (res.ok) {
            alert(data.message);
            window.location.href = "/auth.html";
        } else {
            alert(data.detail || "Помилка при скиданні пароля.");
        }
    } catch(err) {
        alert("Помилка зв'язку із сервером.");
    }
});
</script>

</body>
</html>
