<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Militaristica — Фотострічка</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background-color: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar-logo { padding: 20px; text-align: center; border-bottom: 1px solid #333; }
        .sidebar-logo img { max-width: 80%; }
        .sidebar-menu { display: flex; flex-direction: column; padding: 10px 0; }
        .menu-item { padding: 15px 20px; color: #aaa; text-decoration: none; border-left: 4px solid transparent; transition: 0.3s; }
        .menu-item:hover, .menu-item.active { background-color: #282c34; color: #fff; border-left-color: #e06c75; }
        .sidebar-bottom { padding: 20px; border-top: 1px solid #333; }
        .btn-logout { width: 100%; padding: 12px; background-color: transparent; border: 1px solid #a33333; color: #e06c75; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background-color: #a33333; color: white; }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { background-color: #1e1e1e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .topbar-title { font-size: 20px; font-weight: bold; color: #fff; text-transform: uppercase; }
        
        .content-area { padding: 30px; }
        
        /* Зона завантаження */
        .upload-card { background: #1e1e1e; border: 2px dashed #444; border-radius: 8px; padding: 30px; text-align: center; margin-bottom: 30px; }
        .upload-card h3 { margin-top: 0; color: #aaa; margin-bottom: 10px; }
        .link-input { padding: 10px; background: #282c34; border: 1px solid #555; color: white; border-radius: 4px; text-align: center; width: 220px; margin-bottom: 20px; font-size: 14px; }
        .btn-upload { background-color: #e06c75; color: white; padding: 12px 25px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; display: inline-block; transition: 0.3s; }
        .btn-upload:hover { background-color: #c9515b; }
        .upload-card input[type="file"] { display: none; }

        /* Галерея фотострічки */
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .media-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .media-img { width: 100%; height: 160px; object-fit: cover; background: #282c34; border-bottom: 1px solid #333; }
        .media-link-info { padding: 8px; text-align: center; font-size: 12px; font-weight: bold; background: #1a1e18; }
        .media-actions { padding: 10px; display: flex; justify-content: center; }
        .btn-delete { width: 100%; background-color: #e06c75; color: white; border: none; padding: 8px 0; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-delete:hover { background-color: #c9515b; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="sidebar-logo"><img src="logo.jpg" alt="Logo"></div>
            <div class="sidebar-menu">
                <a href="admin_dashboard.html" class="menu-item">📊 Головна (Дашборд)</a>
                <a href="admin_orders.html" class="menu-item">📦 Замовлення</a>
                <a href="admin_products.html" class="menu-item">🛍️ Товари</a>
                <a href="admin_users.html" class="menu-item" id="menuUsers">👥 Користувачі</a>
                <a href="admin_media.html" class="menu-item active" id="menuMedia">🖼️ Фотострічка</a>
            </div>
        </div>
        <div class="sidebar-bottom">
            <button class="btn-logout" onclick="window.location.href='index.html'">НА ГОЛОВНУ</button>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="topbar-title">Управління фотострічкою</div>
            <div id="topUserName" style="color: #aaa;"></div>
        </div>

        <div class="content-area">
            <div class="upload-card">
                <h3>Завантажте нові фотографії для стрічки</h3>
                <p style="color: #888; font-size: 13px; margin-bottom: 15px;">
                    Якщо хочете, щоб клік по банеру відкривав товар, впишіть його ID (знайти можна в списку товарів).
                </p>
                
                <!-- Нове поле для ID товару -->
                <input type="number" id="linkedProductId" class="link-input" placeholder="ID товару (необов'язково)"><br>

                <label class="btn-upload">
                    + Вибрати файли (можна кілька)
                    <input type="file" id="mediaFileInput" accept="image/*" multiple onchange="uploadMediaFiles(this)">
                </label>
            </div>

            <div class="media-grid" id="mediaGrid">
                <!-- Картки зображень завантажуються із сервера -->
            </div>
        </div>
    </div>

    <script>
        let user = JSON.parse(localStorage.getItem('militaristica_user'));
        if (!user || user.role !== 'admin') { 
            alert("Цей розділ доступний лише Головному Адміністратору!");
            window.location.href = 'admin_dashboard.html'; 
        }

        document.getElementById('topUserName').innerText = `Привіт, ${user.name}`;

        async function loadMedia() {
            try {
                let res = await fetch('/api/media');
                let items = await res.json();
                
                let container = document.getElementById('mediaGrid');
                container.innerHTML = '';

                if (items.length === 0) {
                    container.innerHTML = '<p style="color: #888;">Фотострічка порожня.</p>';
                    return;
                }

                items.forEach(item => {
                    // Перевіряємо, чи є прив'язка до товару
                    let linkHtml = (item.product_id && parseInt(item.product_id) > 0) 
                        ? `<div class="media-link-info" style="color: #98c379;">🔗 Товар #${item.product_id}</div>`
                        : `<div class="media-link-info" style="color: #555;">Без переходу</div>`;

                    let card = document.createElement('div');
                    card.className = 'media-card';
                    card.innerHTML = `
                        <img src="${item.file_url}" class="media-img" alt="Фото">
                        ${linkHtml}
                        <div class="media-actions">
                            <button class="btn-delete" onclick="deleteMedia(${item.id})">Видалити</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Помилка завантаження фотострічки:", err);
            }
        }

        async function uploadMediaFiles(input) {
            if (!input.files || input.files.length === 0) return;

            // Отримуємо значення ID товару (якщо порожньо, то 0)
            let productId = document.getElementById('linkedProductId').value || 0;

            let formData = new FormData();
            formData.append("requester_id", user.id);
            formData.append("product_id", productId); // Додаємо ID товару до запиту

            for (let i = 0; i < input.files.length; i++) {
                formData.append("files", input.files[i]);
            }

            try {
                let res = await fetch('/api/media/upload', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    alert("Фото успішно додано до фотострічки!");
                    input.value = ''; // Очищаємо поле файлів
                    document.getElementById('linkedProductId').value = ''; // Очищаємо поле ID
                    loadMedia();
                } else {
                    let err = await res.json();
                    alert("Помилка: " + (err.detail || "Не вдалося завантажити фотографії."));
                }
            } catch (err) {
                console.error(err);
                alert("Помилка зв'язку з сервером.");
            }
        }

        async function deleteMedia(id) {
            if (!confirm("Видалити це фото з фотострічки?")) return;

            try {
                let res = await fetch(`/api/media/${id}?requester_id=${user.id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadMedia();
                } else {
                    let err = await res.json();
                    alert("Помилка: " + (err.detail || "Не вдалося видалити фото."));
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener("DOMContentLoaded", loadMedia);
    </script>
</body>
</html>
